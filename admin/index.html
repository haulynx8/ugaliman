<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Ugaliman Kitchen Content Editor</title>
  <style>
    #account { display: none; max-width: 360px; margin: 12vh auto; padding: 0 20px; font-family: system-ui, sans-serif; color: #222; }
    #account h1 { font-size: 1.4rem; margin: 0 0 8px; }
    #account p { margin: 0 0 16px; line-height: 1.4; }
    #account label { display: block; font-size: .9rem; margin-bottom: 6px; }
    #account input { width: 100%; box-sizing: border-box; padding: 10px; margin-bottom: 14px; border: 1px solid #bbb; border-radius: 6px; font-size: 1rem; }
    #account button { width: 100%; padding: 11px; border: 0; border-radius: 6px; background: #1d1d1d; color: #fff; font-size: 1rem; cursor: pointer; }
    #account button:disabled { opacity: .6; cursor: default; }
    #account-error { color: #b00020; }
  </style>
</head>
<body>
    <script src="https://cdn.jsdelivr.net/npm/decap-cms@beta/dist/decap-cms.js"></script>
</body>
</html>
